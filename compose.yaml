name: eir
services:
  eir:
    image: ${EIR_IMAGE:-eir:local}
    build: .
    restart: unless-stopped
    ports:
      - "${EIR_BIND_ADDRESS:-0.0.0.0}:${EIR_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://eir:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/eir?sslmode=disable
      MQTT_URL: ${MQTT_URL:?Set MQTT_URL in .env to your existing MQTT broker}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_PREFIX: ${MQTT_PREFIX:-eir/v1}
      EIR_PUSH_ENABLED: ${EIR_PUSH_ENABLED:-false}
      EIR_PUSH_VAPID_PUBLIC_KEY: ${EIR_PUSH_VAPID_PUBLIC_KEY:-}
      EIR_PUSH_VAPID_PRIVATE_KEY: ${EIR_PUSH_VAPID_PRIVATE_KEY:-}
      EIR_PUSH_VAPID_SUBJECT: ${EIR_PUSH_VAPID_SUBJECT:-}
      EIR_PUBLIC_URL: ${EIR_PUBLIC_URL:?Set EIR_PUBLIC_URL to the LAN address reachable by ESP32}
      HTTP_ADDR: :8080
      WEB_DIR: /app/web/dist
      FIRMWARE_DIR: /data/firmwares
      DOCUMENT_DIR: /data/documents
      EIR_DOCUMENT_MAX_BYTES: ${EIR_DOCUMENT_MAX_BYTES:-26214400}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - firmware_data:/data/firmwares
      - documents_data:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      PGDATA: ${POSTGRES_DATA_DIR:-/var/lib/postgresql/data}
      POSTGRES_DB: eir
      POSTGRES_USER: eir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:${POSTGRES_VOLUME_TARGET:-/var/lib/postgresql/data}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eir -d eir"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging
volumes:
  postgres_data:
  firmware_data:
  documents_data:
